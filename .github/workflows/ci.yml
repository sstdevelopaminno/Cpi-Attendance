name: Cpi Attendance Foundation CI
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm run check
  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: attendance_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: attendance_test
    steps:
      - uses: actions/checkout@v4
      - name: PostgreSQL client version
        run: psql --version
      - name: Bootstrap disposable Supabase auth simulation
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/00_bootstrap.sql
      - name: Apply draft initial schema to disposable database
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261027_attendance_core_initial.sql
      - name: Apply secure API functions
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261027_attendance_secure_punch.sql
      - name: Apply rate limiter and login context migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261027_attendance_login_gate.sql
      - name: Prove cross-tenant isolation, QR, GPS and idempotency
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/01_access_e2e.sql
      - name: Prove login rate limiting and tenant-scoped identity
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/02_login_gate.sql
