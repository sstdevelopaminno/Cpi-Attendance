name: Cpi Attendance Foundation CI
on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm run check
  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: attendance_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: attendance_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: psql --version
      - name: Bootstrap disposable Supabase auth simulation
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/00_bootstrap.sql
      - name: Apply all migrations to disposable database
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261027_attendance_core_initial.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261027_attendance_secure_punch.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261027_attendance_login_gate.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261027_attendance_sites_read.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261027_attendance_leave_workflow.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261027_attendance_leave_admin_read.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261029_attendance_hr_recruitment_draft.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261029_attendance_hr_dashboard.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261029_attendance_hr_probation.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261029_attendance_hr_application_mutations.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261029_attendance_reader_handoff.sql
      - name: Test cross-tenant, QR, GPS and idempotency
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/01_access_e2e.sql
      - name: Test login context, rate limiting and HR sites
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/sql/02_login_gate.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/03_sites.sql
      - name: Test leave isolation, approvals and replay
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/04_leave.sql
      - name: Test HR pending leave queue isolation
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/05_leave_queue.sql
      - name: Test HR applicant approval, tenant/role isolation and consent
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/06_hr_recruitment.sql
      - name: Test employee shifts and HR time event tenant isolation
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/07_hr_events_employee_shifts.sql
      - name: Security acceptance for manager role and RPC grants
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/08_manager_and_rpc_grants.sql
      - name: Test authorized HR dashboard counts and payroll unknown values
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/09_hr_dashboard.sql
      - name: Test recruitment approval vs probation confirmation
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/10_hr_probation.sql
      - name: Test applicant soft archive and audited correction
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/11_hr_application_mutations.sql
      - name: Test encrypted, tenant-scoped HR Android reader sessions
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/12_reader_handoff.sql
      - name: Verify six-digit IT subscription and scoped Owner HR login
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261029_attendance_six_digit_subscription.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/13_hr_six_digit_package.sql

      - name: Test subscriber-owned Android reader auto-connect, acknowledgement and revocation
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261029_attendance_reader_autoconnect.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261029_attendance_reader_revocation_guard.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261029_attendance_reader_save_receipt_window.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261029_attendance_hr_bound_reader_login.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/14_hr_android_autoconnect.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/15_hr_multi_accounts.sql
