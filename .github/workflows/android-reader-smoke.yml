name: Android USB CCID Reader Smoke APK

on:
  workflow_dispatch:
  push:
    branches:
      - feat/android-usb-ccid-reader-smoke-*
    paths:
      - 'tools/android-reader-smoke/**'
      - '.github/workflows/android-reader-smoke.yml'
  pull_request:
    paths:
      - 'tools/android-reader-smoke/**'
      - '.github/workflows/android-reader-smoke.yml'

permissions:
  contents: read

jobs:
  ccid-codec:
    name: Verify CCID packet codec
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile and run offline protocol tests
        run: |
          mkdir -p /tmp/ccid-test-classes
          javac -d /tmp/ccid-test-classes \
            tools/android-reader-smoke/app/src/main/java/com/cpiattendance/readerprobe/CcidProtocol.java \
            tools/android-reader-smoke/tests/com/cpiattendance/readerprobe/ProtocolSmokeTest.java
          java -cp /tmp/ccid-test-classes com.cpiattendance.readerprobe.ProtocolSmokeTest

  debug-apk:
    name: Build offline Android USB reader diagnostic APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: ccid-codec
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android build platform
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile debug APK (never releases to production)
        run: gradle --no-daemon --project-dir tools/android-reader-smoke :app:assembleDebug
      - name: SHA-256 of APK
        run: |
          cd tools/android-reader-smoke/app/build/outputs/apk/debug
          sha256sum app-debug.apk > app-debug.apk.sha256
          ls -lh app-debug.apk app-debug.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: CpiAttendance-ReaderSmoke-debug-apk
          path: |
            tools/android-reader-smoke/app/build/outputs/apk/debug/app-debug.apk
            tools/android-reader-smoke/app/build/outputs/apk/debug/app-debug.apk.sha256
          retention-days: 7
          if-no-files-found: error
