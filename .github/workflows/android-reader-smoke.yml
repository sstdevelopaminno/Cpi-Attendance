name: Android USB CCID Reader Smoke APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/android-usb-ccid-reader-smoke-*
      - feat/android-hr-reader-pairing-ui-*
      - fix/android-hr-native-autoconnect-*
    paths:
      - 'tools/android-reader-smoke/**'
      - 'scripts/android-device-preview.ps1'
      - '.github/workflows/android-reader-smoke.yml'
  pull_request:
    paths:
      - 'tools/android-reader-smoke/**'
      - 'scripts/android-device-preview.ps1'
      - '.github/workflows/android-reader-smoke.yml'

permissions:
  contents: read

jobs:
  ccid-codec:
    name: Verify CCID packet codec
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile and run offline protocol tests
        run: |
          mkdir -p /tmp/ccid-test-classes
          javac -d /tmp/ccid-test-classes \
            tools/android-reader-smoke/app/src/main/java/com/cpiattendance/readerprobe/CcidProtocol.java \
            tools/android-reader-smoke/tests/com/cpiattendance/readerprobe/ProtocolSmokeTest.java
          java -cp /tmp/ccid-test-classes com.cpiattendance.readerprobe.ProtocolSmokeTest
          javac -d /tmp/ccid-test-classes \
            tools/android-reader-smoke/app/src/main/java/com/cpiattendance/readerprobe/AttendanceAccessPolicy.java \
            tools/android-reader-smoke/tests/com/cpiattendance/readerprobe/AttendanceModePolicyTest.java
          java -cp /tmp/ccid-test-classes com.cpiattendance.readerprobe.AttendanceModePolicyTest
          javac -d /tmp/ccid-test-classes \
            tools/android-reader-smoke/app/src/main/java/com/cpiattendance/readerprobe/ScreenCapturePolicy.java \
            tools/android-reader-smoke/tests/com/cpiattendance/readerprobe/ScreenCapturePolicyTest.java
          java -cp /tmp/ccid-test-classes com.cpiattendance.readerprobe.ScreenCapturePolicyTest

  debug-apk:
    name: Build Android HR encrypted reader handoff diagnostic APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: ccid-codec
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use runner's preinstalled Android SDK and install API 35
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile debug APK (never releases to production)
        run: gradle --no-daemon --project-dir tools/android-reader-smoke :app:assembleDebug
      - name: SHA-256 of APK
        run: |
          cd tools/android-reader-smoke/app/build/outputs/apk/debug
          sha256sum app-debug.apk > app-debug.apk.sha256
          ls -lh app-debug.apk app-debug.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: CpiAttendance-Android-HR-v0.6.2-UI-Preview-debug-apk
          path: |
            tools/android-reader-smoke/app/build/outputs/apk/debug/app-debug.apk
            tools/android-reader-smoke/app/build/outputs/apk/debug/app-debug.apk.sha256
          retention-days: 7
          if-no-files-found: error

  release-test-apk:
    name: Publish Android HR v0.6.2 UI preview test APK
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: debug-apk
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: CpiAttendance-Android-HR-v0.6.2-UI-Preview-debug-apk
          path: release
      - name: Create or update the mobile-downloadable test release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: android-hr-v0.6.2-ui-preview-test
        run: |
          set -euo pipefail
          cd release
          mv app-debug.apk CpiAttendance-Android-HR-v0.6.2-ui-preview-test.apk
          sha256sum CpiAttendance-Android-HR-v0.6.2-ui-preview-test.apk > CpiAttendance-Android-HR-v0.6.2-ui-preview-test.apk.sha256
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              CpiAttendance-Android-HR-v0.6.2-ui-preview-test.apk \
              CpiAttendance-Android-HR-v0.6.2-ui-preview-test.apk.sha256 \
              --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" \
              CpiAttendance-Android-HR-v0.6.2-ui-preview-test.apk \
              CpiAttendance-Android-HR-v0.6.2-ui-preview-test.apk.sha256 \
              --target "$GITHUB_SHA" --prerelease \
              --title "Cpi Attendance Android HR v0.6.2 UI Preview (Test)" \
              --notes "Debug/test build for UI development: screen mirroring is intentionally enabled and visibly labelled. Non-debuggable production builds keep FLAG_SECURE. Do not share screenshots containing Thai ID card data. Build/CI success does not replace real-device acceptance." \
              --repo "$GITHUB_REPOSITORY"
          fi
